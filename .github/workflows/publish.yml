name: Publish to npm

# Fires whenever a GitHub Release is published. Since auto-release.yml creates
# and publishes a release automatically for every package.json version bump on
# main, this normally fires on its own - no manual tagging needed. Publishing
# a release by hand still works the same way, if ever needed.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # allows npm provenance, ties the published package back to this exact commit/workflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci || npm install

      - run: npm run check

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
